    <h2>The Box Model</h2>
    <button onclick="toggleBoxes()">Toggle Visible Boxes</button>
    <p id="status">Boxes Invisible</p>

    <script>
        function toggleBoxes() {
            document.getElementById("status").innerHTML = "Boxes Visible! (coming soon)"
        }
    </script>

    <ul>
        <li>How content is visually displayed. Everything on a webpage is inside of a box!</li>
        <li>There are 4 properties in the box model: </li>
        <ul>
            <li>Content</li>
            <li>Padding</li>
            <li>Border</li>
            <li>Margin</li>
        </ul>
    </ul>
    
    <!-- <p>The actual box model visual representation will go here with a bunch of styled divs</p> -->
    
    <!--margin: 0 auto means that the top and bottom margins at set to 0, while left and right margins are automatically calculated-->

        <div style="margin: 0 auto; background: purple; height: 250px; width: 350px;">
            <div style="margin: 0 auto; background: lightgreen; height: 200px; width: 300px;">
                <div style="margin: 0 auto; background: red; height: 150px; width: 250px;">
                    <p>Content</p>
                </div>
            </div>

    </div>
